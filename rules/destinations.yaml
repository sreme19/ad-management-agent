# Destination registry — machine-readable, enforced by `ad-agent propose`
#
# This is the only rule file the CLI reads directly (every other file under
# rules/ is read live by a skill), because it backs a hard gate: propose
# REFUSES to write a record whose ad-set audience doesn't match the framing of
# the page it sends traffic to.
#
# Why it exists: on 2026-08-24 a review of the first live Snap/Meta lead
# campaigns found 98% of lead-form submissions and 100% of /get -> Play Store
# taps were men. Part of that is creative (see rules/creative-generation.md
# section 1), but the destination is the harder blocker — /get is written
# entirely in the second person to a man ("She asked how you spend your
# weekends", "2 left -> then she sees you", "Never a ranking against men he
# cannot see"). A woman who taps a women's ad lands on a page explaining how a
# man gets in front of her.
#
# How the gate opens: build the woman-facing destination, then add it here with
# audience: women. Editing this file is the intended and only way to unblock a
# blocked proposal — there is deliberately no --force flag, because an override
# flag would make the gate advisory and this one is meant to hold.
#
# `audience`     men | women | neutral — whose point of view the page's copy
#                occupies. `neutral` matches any ad set.
# `paid_traffic` false means the page cannot receive paid traffic at all
#                (e.g. token-gated), regardless of audience match.
# `verified`     the date someone actually read the page's copy to classify it.
#                Re-read and re-date it when the page changes.

destinations:
  /get:
    audience: men
    paid_traffic: true
    verified: 2026-08-24
    note: >-
      Second person is the man on every line; she is third person throughout.
      Currently the only public destination carrying the tracking.md UTM scheme.
      Needs either a women's variant switched off a UTM param, or a separate
      public route, before any women-targeted ad set can point at it.

  /get/w:
    audience: women
    paid_traffic: true
    verified: 2026-08-27
    note: >-
      The women's variant of /get, built 2026-08-25 and reworked 2026-08-27. Same
      route file, audience switched off the path segment; verification is framed
      as something she receives rather than performs. Copy verified by reading the
      rendered page.
      REWORKED 2026-08-27 and re-dated per this file's own rule. Three changes.
      (1) The page no longer opens on the flood. It was written on the premise
      that her problem is volume, and lrn-2026-08-27-complaint-is-quality-not-volume
      found five creators describing the opposite — attention that is plentiful and
      worthless. It now leads "Vetted before he reaches you", which is also the
      MOVE-ON-PROPER ad's own line, so ad and page no longer change the subject
      between the tap and the scroll. (2) It has imagery for the first time: three
      AI-generated illustrations cut from plates this repo already approved,
      labelled as illustrations in the footer per compliance.md 6.2. (3) IT NOW
      CAPTURES A LEAD — WhatsApp or email, writing to marketing_leads, which had
      existed since 2026-08-15 with a dialer attached and had never been written to
      by anything. That closes the gap in lrn-2026-08-26-no-lead-capture-on-destinations
      and gives iPhone traffic somewhere to go; whether it converts or just adds
      friction is q-2026-08-26-lead-capture-conversion, still open until there is
      data. The Play tap remains the primary CTA and the form sits below it, so the
      funnel that already works was not put behind the one being tested.
      Also removed: the per-man percentages (92/78/61) the old mock showed beside
      each profile, which was a hard numeric ranking of people and is what
      compliance.md #5 forbids.
      Deployed 2026-08-25 (pocket-dating-coach d1b04182) and opened to paid traffic
      2026-08-26 after tracking.md's checks passed against the live URL: /get 200,
      /get/w 200, /get/xyz 404; her copy confirmed; the Play referrer carries
      ra_lp=get_w plus every utm_*; a real phone visit recorded a view under its
      own campaign on network=snap and joined to its tap in visitFunnel.
      Opening it also required pocket-dating-coach e9b45a83 — d1b04182 had updated
      the DB constraint and the LandingPage type but not the two beacon endpoints,
      so every view on this page was being silently discarded and every tap filed
      under /get. Views are this audience's success metric, so that would have
      spent the budget and measured a permanent zero.

  /beta:
    audience: women
    paid_traffic: false
    verified: 2026-08-24
    note: >-
      The women's invite flow, and referenced as such by a comment at
      src/routes/get/+page.svelte:19 in pocket-dating-coach. Implemented as
      /beta/[token] — invite-token-gated, so it cannot serve paid traffic even
      though its audience matches. Not a substitute for a public women's page.

# Copy this to config.local.yaml (gitignored, never committed) and fill in
# real values. Nothing in this file is secret; config.local.yaml is where
# secrets live.

ledger:
  # Directory containing campaigns/ and INDEX.md. Defaults to the repo root
  # if you never create config.local.yaml at all — the CLI works out of the
  # box with zero setup for anything that doesn't need PDC access.
  root: "."

pdc:
  # pocket-dating-coach's authenticated internal analytics endpoint (see
  # SPEC.md, "Data access"). Returns the exact same JSON buildAdAnalytics()
  # produces for the admin dashboard — this repo never re-derives that
  # aggregation itself. Not live until the pocket-dating-coach PR adding
  # this route has shipped.
  analytics_url: "https://pocket-dating-coach.vercel.app/api/internal/ad-analytics"
  # The ADS_AGENT_API_KEY value set as a Vercel env var on pocket-dating-coach.
  api_key: ""

  # Optional, secondary channel: a least-privilege read-only Postgres role
  # (ads_agent_ro) scoped to marketing/spend tables only — never member data.
  # Used only for raw/exploratory queries the analytics endpoint doesn't
  # answer; never to recompute a rate or verdict the endpoint already owns.
  readonly_db_url: ""

snap:
  # Snap Marketing API credentials, for `ad-agent snap ...`. Registered under
  # Business Manager > Business details > OAuth apps; the client secret is shown
  # once at creation and cannot be regenerated, so keep it somewhere durable.
  #
  # NOTE: holding these reverses SPEC.md decision #10, which deliberately kept
  # any credential that could reach a live ad account out of this repo. That
  # reversal is the app owner's explicit call (2026-08-26) and is recorded in
  # SPEC.md — it is not an oversight.
  client_id: ""
  client_secret: ""
  redirect_uri: ""
  ad_account_id: ""
  refresh_token: ""
  profile_id: ""
  pixel_id: ""

meta:
  # Meta Marketing API credentials, for the Meta client (src/.../meta.py).
  #
  # NOTE: holding these reverses the Meta half of SPEC.md decision #10, which had
  # kept any credential that could reach a live Meta account out of this repo.
  # That reversal is the app owner's explicit call (2026-08-27) and is recorded in
  # SPEC.md — it is not an oversight.
  #
  # Base URL https://graph.facebook.com/v26.0 (pinned in meta.py: Meta began
  # auto-upgrading unpinned callers on 2026-07-29, and versions expire).
  app_id: ""
  app_secret: ""

  # A SYSTEM-USER token, not a user token. Generated in Business settings >
  # System users > riteangle-api > Generate token, with scopes ads_management,
  # ads_read, business_management, pages_show_list, pages_read_engagement,
  # pages_manage_ads.
  #
  # It does NOT expire, which is why this shape was chosen: a long-lived user
  # token lasts ~60 days and Meta has no refresh-token equivalent, so it would
  # expire mid-campaign, silently. Like the Snap client secret, it is shown once
  # at creation and there is no regenerate — keep it somewhere durable.
  access_token: ""

  # The `act_` prefix is optional here; the client adds it if absent. This account
  # has to be owned by the business portfolio, not personal, or a system user
  # cannot be assigned it at all.
  ad_account_id: ""

  # The Page the ad renders under. Not optional and with no Snap equivalent: a
  # Snap ad renders under a profile_id, whereas a Meta ad IS a post by a Page.
  # Read the id off the ACTIVE Riteangle Page — the account also holds a
  # deactivated Page of the same name, so a name lookup would be ambiguous.
  page_id: ""

  # Meta Pixel / dataset. Required for LANDING_PAGE_VIEWS optimisation, and
  # stricter than Snap: Snap counts landing-page views natively in its in-app
  # browser, so a pixel-less Snap squad still reported 59 of them. Meta has no
  # such fallback — no pixel means no signal at all.
  pixel_id: ""
